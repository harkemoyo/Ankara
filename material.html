    <script type="module">
        document.addEventListener("DOMContentLoaded", () => {
            const grid = document.getElementById('fabrics-grid');
            let loadedFabrics = [];
            let totalCount = 0;
            let currentPage = 1;
            const perPage = 8;
            const pagination = document.getElementById('fabrics-pagination');
            const CACHE_TTL_MS = 5 * 60 * 1000;

            function cacheKey(page) { return `fabrics_page_${page}`; }
            function cacheMetaKey(page) { return `fabrics_page_${page}_meta`; }

            function tryLoadFromCache() {
                try {
                    const meta = JSON.parse(localStorage.getItem(cacheMetaKey(currentPage)) || 'null');
                    if (!meta || Date.now() - meta.timestamp > CACHE_TTL_MS) return false;
                    const cached = JSON.parse(localStorage.getItem(cacheKey(currentPage)) || 'null');
                    if (!cached || !cached.products) return false;
                    loadedFabrics = cached.products;
                    totalCount = cached.total;
                    renderFabrics();
                    return true;
                } catch (e) { return false; }
            }

            function saveCache(products, total) {
                try {
                    localStorage.setItem(cacheKey(currentPage), JSON.stringify({ products, total }));
                    localStorage.setItem(cacheMetaKey(currentPage), JSON.stringify({ timestamp: Date.now() }));
                } catch (e) { }
            }

            async function fetchFabrics() {
                try {
                    const firstApiPage = 2 * (currentPage - 1) + 1;
                    const firstRes = await fetch(`/api/products?product_type=fabric&limit=4&page=${firstApiPage}`);
                    if (!firstRes.ok) throw new Error('Failed to fetch first fabrics');
                    const firstData = await firstRes.json();

                    loadedFabrics = firstData.products || [];
                    totalCount = firstData.pagination ? firstData.pagination.total : 0;

                    if (loadedFabrics.length === 0) {
                        grid.innerHTML = `<div class="col-12 text-center" style="grid-column: 1/-1; padding: 3rem;">
                            <p style="font-size: 1.6rem; color: #555;">No fabrics found.</p>
                        </div>`;
                        if (pagination) pagination.innerHTML = '';
                        return;
                    }

                    saveCache(loadedFabrics, totalCount);
                    renderProductCards(loadedFabrics, false);
                    renderPagination();

                    const secondApiPage = 2 * currentPage;
                    const secondRes = await fetch(`/api/products?product_type=fabric&limit=4&page=${secondApiPage}`);
                    if (!secondRes.ok) throw new Error('Failed to fetch remaining fabrics');
                    const secondData = await secondRes.json();

                    const chunk2 = secondData.products || [];
                    if (chunk2.length > 0) {
                        loadedFabrics = [...loadedFabrics, ...chunk2];
                        saveCache(loadedFabrics, totalCount);
                        renderProductCards(chunk2, true);
                    }
                } catch (error) {
                    console.error('Error loading fabrics:', error);
                    if (grid) {
                        grid.innerHTML = `<div class="col-12 text-center" style="grid-column: 1/-1; padding: 3rem;">
                            <p style="font-size: 1.6rem; color: #d9534f;">Failed to load fabrics. Please refresh the page.</p>
                        </div>`;
                    }
                }
            }

            function renderProductCards(products, append) {
                if (!grid || products.length === 0) return;
                const isFirstPage = currentPage === 1;
                const html = products.map((fabric, index) => {
                    const actualIndex = append ? (loadedFabrics.length - products.length) + index : index;
                    const primaryImage = fabric.images && fabric.images[0] ? fabric.images[0] : 'assets/DSC02676.jpg';
                    const loading = isFirstPage && actualIndex < 4 ? 'eager' : 'lazy';
                    const priceFormatted = window.AnkaraCurrency
                        ? window.AnkaraCurrency.convertAndFormat(fabric.price)
                        : `KSh ${parseFloat(fabric.price).toLocaleString()}`;

                    const compareFormatted = fabric.compare_at_price && parseFloat(fabric.compare_at_price) > parseFloat(fabric.price)
                        ? `<span class="old__price" style="text-decoration: line-through; color: #999; margin-left: 8px; font-size: 1.3rem;">${window.AnkaraCurrency
                            ? window.AnkaraCurrency.convertAndFormat(fabric.compare_at_price)
                            : `KSh ${parseFloat(fabric.compare_at_price).toLocaleString()}`
                        }</span>`
                        : '';

                    return `
                    <article class="material__card">
                        <a href="/product/${fabric.handle}" style="display: block; flex: 1; overflow: hidden; position: relative;">
                            <img src="${primaryImage}" alt="${fabric.title}" loading="${loading}" decoding="async" class="material__card--img" />
                        </a>
                        <div class="material__card--info" style="padding: 2rem 1.5rem; text-align: center; border-top: 1px solid var(--border-color); background: #fff;">
                            <h3 style="font-size: 1.6rem; color: var(--primary-color); margin-bottom: 0.8rem; font-family: var(--font-heading); font-weight: 600;">
                                <a href="/product/${fabric.handle}" style="color: inherit; text-decoration: none;">${fabric.title}</a>
                            </h3>
                            <div style="font-size: 1.4rem; font-weight: 600; color: var(--primary-color); margin-bottom: 0.5rem;">
                                <span>${priceFormatted}</span>
                                ${compareFormatted}
                            </div>
                            <button type="button" class="js-fabric-quickview" data-handle="${fabric.handle}" style="display: inline-block; width: 100%; padding: 10px 14px; font-size: 1.3rem; font-weight: 600; color: var(--primary-color, #111); background: #f7f7f7; border: 1px solid var(--border-color, #e5e5e5); border-radius: 6px; text-decoration: none; margin-top: 10px; transition: all 0.2s ease; cursor: pointer;">
                                View Fabric
                            </button>
                        </div>
                    </article>
                    `;
                }).join('');

                if (append) {
                    grid.insertAdjacentHTML('beforeend', html);
                } else {
                    grid.innerHTML = html;
                }
            }

            function renderPagination() {
                if (!pagination) return;
                const totalPages = Math.ceil(totalCount / perPage) || 1;
                if (currentPage > totalPages) currentPage = totalPages;

                if (totalPages <= 1) {
                    pagination.innerHTML = '';
                    pagination.style.display = 'none';
                    return;
                }

                pagination.style.display = 'block';

                const prevArrow = `<svg xmlns="http://www.w3.org/2000/svg" width="22.51" height="20.443" viewbox="0 0 512 512"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="48" d="M244 400L100 256l144-144M120 256h292"/></svg>`;
                const nextArrow = `<svg xmlns="http://www.w3.org/2000/svg" width="22.51" height="20.443" viewbox="0 0 512 512"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="48" d="M268 112l144 144-144 144M392 256H100"/></svg>`;

                let pageNumbers = '';
                for (let i = 1; i <= totalPages; i++) {
                    if (i === currentPage) {
                        pageNumbers += `<li class="pagination__list"><span class="pagination__item pagination__item--current">${i}</span></li>`;
                    } else {
                        pageNumbers += `<li class="pagination__list"><button type="button" class="pagination__item link" data-page="${i}">${i}</button></li>`;
                    }
                }

                const prevDisabled = currentPage <= 1 ? 'disabled' : '';
                const prevData = currentPage > 1 ? `data-page="${currentPage - 1}"` : '';
                const nextDisabled = currentPage >= totalPages ? 'disabled' : '';
                const nextData = currentPage < totalPages ? `data-page="${currentPage + 1}"` : '';

                pagination.innerHTML = `
                    <nav class="pagination">
                        <ul class="pagination__wrapper">
                            <li class="pagination__list">
                                <button type="button" class="pagination__item pagination__item--arrow link ${prevDisabled}" ${prevData} style="${currentPage <= 1 ? 'opacity:0.5;cursor:not-allowed;' : ''}">
                                    ${prevArrow}
                                    <span class="visually-hidden">page left arrow</span>
                                </button>
                            </li>
                            ${pageNumbers}
                            <li class="pagination__list">
                                <button type="button" class="pagination__item pagination__item--arrow link ${nextDisabled}" ${nextData} style="${currentPage >= totalPages ? 'opacity:0.5;cursor:not-allowed;' : ''}">
                                    ${nextArrow}
                                    <span class="visually-hidden">page right arrow</span>
                                </button>
                            </li>
                        </ul>
                    </nav>
                `;
            }

            function renderFabrics() {
                if (!grid) return;
                if (loadedFabrics.length === 0) {
                    grid.innerHTML = `<div class="col-12 text-center" style="grid-column: 1/-1; padding: 3rem;">
                        <p style="font-size: 1.6rem; color: #555;">No fabrics found.</p>
                    </div>`;
                    if (pagination) pagination.innerHTML = '';
                    return;
                }
                renderProductCards(loadedFabrics, false);
                renderPagination();
            }

            // Handle pagination clicks
            if (pagination) {
                pagination.addEventListener('click', (e) => {
                    const btn = e.target.closest('button');
                    if (!btn || !btn.dataset.page) return;
                    currentPage = parseInt(btn.dataset.page, 10);
                    fetchFabrics();
                    grid.scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
            }

            // Open existing quick-view popup when View Fabric is clicked
            if (grid) {
                grid.addEventListener('click', (e) => {
                    const btn = e.target.closest('.js-fabric-quickview');
                    if (!btn) return;
                    e.preventDefault();
                    e.stopPropagation();
                    window.dispatchEvent(new CustomEvent('quickview:open', {
                        detail: { handle: btn.dataset.handle }
                    }));
                });
            }

            // Render from cache immediately, then refresh from server
            tryLoadFromCache();
            fetchFabrics();

            // Refresh view on currency switch
            window.addEventListener('currency:changed', renderFabrics);
            window.addEventListener('settings:loaded', renderFabrics);
            window.addEventListener('settings:loaded', (e) => {
                const settings = e.detail;
                if (settings) {
                    if (settings.fabric_hero_title) {
                        document.getElementById('fabric-hero-title').textContent = settings.fabric_hero_title;
                    }
                    if (settings.fabric_hero_subtitle) {
                        document.getElementById('fabric-hero-subtitle').textContent = settings.fabric_hero_subtitle;
                    }
                }
            });
        });
    </script>
