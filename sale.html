<!DOCTYPE html>

<html lang="en">

<head>

    <base href="/" />
    <meta charset="utf-8" />
    <meta content="width=device-width,initial-scale=1" name="viewport" />
    <title>Sale – Mary Humphrey Wear</title>

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="shortcut icon" href="/favicon.ico">

    <!-- Open Graph / Facebook -->
    <meta property="og:title" content="Sale – Mary Humphrey Wear">
    <meta property="og:description"
        content="Refresh your wardrobe with authentic African fashion and Ankara couture on sale up to 30% off.">
    <meta property="og:image" content="https://maryhumphreywear.org/og-image.jpg">
    <meta property="og:url" content="https://maryhumphreywear.org/sale.html">
    <meta property="og:type" content="website">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Sale – Mary Humphrey Wear">
    <meta name="twitter:description"
        content="Refresh your wardrobe with authentic African fashion and Ankara couture on sale up to 30% off.">
    <meta name="twitter:image" content="https://maryhumphreywear.org/og-image.jpg">

    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />

    <link href="assets/swiper-bundle.min.css" rel="stylesheet" />
    <link href="assets/base.css" rel="stylesheet" />
    <link href="assets/normalize.css" rel="stylesheet" />

    <link href="assets/filter.css" rel="stylesheet" />
    <link href="assets/shop.css" rel="stylesheet" />
    <script defer="" src="assets/swiper-bundle.min.js"></script>
    <script defer="" src="assets/cart.js"></script>
    <script defer="" src="assets/global.js"></script>
    <script src="assets/config.js"></script>
    <script src="assets/supabase.umd.js"></script>
    <script defer="" src="assets/filter.js"></script>
    <script defer="" src="assets/js/components/core.js" type="module"></script>
    <script defer src="assets/announcement.js"></script>
    <script defer src="assets/supabase-client.js" type="module"></script>
    <script defer src="assets/sale-link.js"></script>
</head>

<body>
    <div id="preloader">
        <div class="ctn-preloader" id="ctn-preloader">
            <div class="animation-preloader">
                <div class="spinner"></div>
                <div class="txt-loading">
                    <span class="letters-loading" data-text-preloader="M">M</span>
                    <span class="letters-loading" data-text-preloader="H">H</span>
                    <span class="letters-loading" data-text-preloader="W">W</span>
                </div>
            </div>
            <div class="loader-section section-left"></div>
            <div class="loader-section section-right"></div>
        </div>
    </div>
    <!-- Shared Site Header Component -->
    <header id="site-header" class="header__section" data-section-id="header"></header>
    <script defer src="assets/header.js"></script>

    <main class="site__main">
        <!-- Breadcrumb -->
        <section class="breadcrumb__section">
            <div class="page-width">
                <h1 class="breadcrumb__title"></h1>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb--content">
                        <li class="breadcrumb-item">
                            <a href="/">Home</a>
                        </li>
                        <div class="divider">/</div>
                        <li class="breadcrumb-item active">Collections</li>
                    </ol>
                </nav>
            </div>
        </section>
        <!-- Products Grid -->
        <div class="shop__section section--padding pt-0">
            <div class="page-width">
                <div class="row">
                    <!-- Offcanvas Filter Overlay -->
                    <div class="filter-offcanvas" id="filter-offcanvas">
                        <div class="filter-offcanvas__header flex-between align-items-center">
                            <h2 class="filter-offcanvas__title">Filter</h2>
                            <button aria-label="Close Filter" class="filter-offcanvas__close"
                                onclick="toggleFilter()">✕</button>
                        </div>
                        <div class="filter-offcanvas__body shop__sidebar--widget widget__area"
                            data-section="collection-filters">
                            <div class="single__widget widget__bg">
                                <h2 class="widget__title h3">Categories</h2>
                                <ul class="widget__categories--menu" id="sidebar-categories">
                                    <!-- Dynamic collections will load here -->
                                </ul>
                            </div>
                            <div class="single__widget widget__bg">
                                <h2 class="widget__title h3">Filter By Size</h2>
                                <ul class="widget__form--check">
                                    <li class="widget__form--check__list">
                                        <label class="widget__form--check__label" for="size-S">S
                                            <span class="facet-count" data-facet="sizes" data-value="S"></span>
                                        </label>
                                        <input class="widget__form--check__input size-filter" data-filter-name="sizes"
                                            id="size-S" type="checkbox" value="S" />
                                        <span class="widget__form--checkmark"></span>
                                    </li>
                                    <li class="widget__form--check__list">
                                        <label class="widget__form--check__label" for="size-M">M
                                            <span class="facet-count" data-facet="sizes" data-value="M"></span>
                                        </label>
                                        <input class="widget__form--check__input size-filter" data-filter-name="sizes"
                                            id="size-M" type="checkbox" value="M" />
                                        <span class="widget__form--checkmark"></span>
                                    </li>
                                    <li class="widget__form--check__list">
                                        <label class="widget__form--check__label" for="size-L">L
                                            <span class="facet-count" data-facet="sizes" data-value="L"></span>
                                        </label>
                                        <input class="widget__form--check__input size-filter" data-filter-name="sizes"
                                            id="size-L" type="checkbox" value="L" />
                                        <span class="widget__form--checkmark"></span>
                                    </li>
                                    <li class="widget__form--check__list">
                                        <label class="widget__form--check__label" for="size-XL">XL
                                            <span class="facet-count" data-facet="sizes" data-value="XL"></span>
                                        </label>
                                        <input class="widget__form--check__input size-filter" data-filter-name="sizes"
                                            id="size-XL" type="checkbox" value="XL" />
                                        <span class="widget__form--checkmark"></span>
                                    </li>
                                    <li class="widget__form--check__list">
                                        <label class="widget__form--check__label" for="size-2X">2X
                                            <span class="facet-count" data-facet="sizes" data-value="2X"></span>
                                        </label>
                                        <input class="widget__form--check__input size-filter" data-filter-name="sizes"
                                            id="size-2X" type="checkbox" value="2X" />
                                        <span class="widget__form--checkmark"></span>
                                    </li>
                                </ul>
                            </div>
                            <div class="single__widget widget__bg">
                                <h2 class="widget__title h3">Filter By Color</h2>
                                <ul class="widget__form--check">
                                    <li class="widget__form--check__list">
                                        <label class="widget__form--check__label" for="color-Red">Red Print
                                            <span class="facet-count" data-facet="colors" data-value="Red Print"></span>
                                        </label>
                                        <input class="widget__form--check__input color-filter" data-filter-name="colors"
                                            id="color-Red" type="checkbox" value="Red Print" />
                                        <span class="widget__form--checkmark"></span>
                                    </li>
                                    <li class="widget__form--check__list">
                                        <label class="widget__form--check__label" for="color-Blue">Blue Print
                                            <span class="facet-count" data-facet="colors"
                                                data-value="Blue Print"></span>
                                        </label>
                                        <input class="widget__form--check__input color-filter" data-filter-name="colors"
                                            id="color-Blue" type="checkbox" value="Blue Print" />
                                        <span class="widget__form--checkmark"></span>
                                    </li>
                                    <li class="widget__form--check__list">
                                        <label class="widget__form--check__label" for="color-Green">Green Print
                                            <span class="facet-count" data-facet="colors"
                                                data-value="Green Print"></span>
                                        </label>
                                        <input class="widget__form--check__input color-filter" data-filter-name="colors"
                                            id="color-Green" type="checkbox" value="Green Print" />
                                        <span class="widget__form--checkmark"></span>
                                    </li>
                                    <li class="widget__form--check__list">
                                        <label class="widget__form--check__label" for="color-Orange">Orange Print
                                            <span class="facet-count" data-facet="colors"
                                                data-value="Orange Print"></span>
                                        </label>
                                        <input class="widget__form--check__input color-filter" data-filter-name="colors"
                                            id="color-Orange" type="checkbox" value="Orange Print" />
                                        <span class="widget__form--checkmark"></span>
                                    </li>
                                    <li class="widget__form--check__list">
                                        <label class="widget__form--check__label" for="color-Gold">Gold Kente
                                            <span class="facet-count" data-facet="colors"
                                                data-value="Gold Kente"></span>
                                        </label>
                                        <input class="widget__form--check__input color-filter" data-filter-name="colors"
                                            id="color-Gold" type="checkbox" value="Gold Kente" />
                                        <span class="widget__form--checkmark"></span>
                                    </li>
                                </ul>
                            </div>
                            <div class="single__widget widget__bg">
                                <h2 class="widget__title h3">Availability</h2>
                                <ul class="widget__form--check">
                                    <li class="widget__form--check__list">
                                        <label class="widget__form--check__label" for="avail-in">In Stock
                                            <span class="facet-count" data-facet="availability"
                                                data-value="in_stock"></span>
                                        </label>
                                        <input class="widget__form--check__input avail-filter"
                                            data-filter-name="availability" id="avail-in" type="checkbox"
                                            value="in_stock" />
                                        <span class="widget__form--checkmark"></span>
                                    </li>
                                    <li class="widget__form--check__list">
                                        <label class="widget__form--check__label" for="avail-out">Out of Stock
                                            <span class="facet-count" data-facet="availability"
                                                data-value="out_of_stock"></span>
                                        </label>
                                        <input class="widget__form--check__input avail-filter"
                                            data-filter-name="availability" id="avail-out" type="checkbox"
                                            value="out_of_stock" />
                                        <span class="widget__form--checkmark"></span>
                                    </li>
                                </ul>
                            </div>
                            <div class="single__widget widget__bg">
                                <h2 class="widget__title h3">Vendor</h2>
                                <ul class="widget__form--check">
                                    <li class="widget__form--check__list">
                                        <label class="widget__form--check__label" for="vendor-mary">Mary Humphrey
                                            African Wear
                                            <span class="facet-count" data-facet="vendor"
                                                data-value="Mary Humphrey African Wear"></span>
                                        </label>
                                        <input class="widget__form--check__input vendor-filter"
                                            data-filter-name="vendor" id="vendor-mary" type="checkbox"
                                            value="Mary Humphrey African Wear" />
                                        <span class="widget__form--checkmark"></span>
                                    </li>
                                </ul>
                            </div>
                            <div class="single__widget price__filter widget__bg">
                                <h2 class="widget__title h3">Filter By Price</h2>
                                <form action="#" class="price__filter--form">
                                    <div class="price__filter--form__inner mb-15 d-flex align-items-center">
                                        <div class="price__filter--group">
                                            <label class="price__filter--label" for="Filter-Price-GTE2">From</label>
                                            <div class="price__filter--input border-radius-5 d-flex align-items-center">
                                                <span class="price__filter--currency">£</span>
                                                <input class="price__filter--input__field border-0"
                                                    id="Filter-Price-GTE2" max="250.00" min="0" name="priceGte"
                                                    placeholder="0" type="number" />
                                            </div>
                                        </div>
                                        <div class="price__divider">
                                            <span>-</span>
                                        </div>
                                        <div class="price__filter--group">
                                            <label class="price__filter--label" for="Filter-Price-LTE2">To</label>
                                            <div class="price__filter--input border-radius-5 d-flex align-items-center">
                                                <span class="price__filter--currency">£</span>
                                                <input class="price__filter--input__field border-0"
                                                    id="Filter-Price-LTE2" max="250.00" min="0" name="priceLte"
                                                    placeholder="250.00" type="number" />
                                            </div>
                                        </div>
                                    </div>
                                    <button class="primary__btn price__filter--btn" type="submit">Filter</button>
                                </form>
                            </div>
                            <div class="single__widget widget__bg">
                                <h2 class="widget__title h3">Featured Products</h2>
                                <div class="shop__sidebar--product" id="sidebar-featured-products">
                                    <div class="small__product--card d-flex skeleton-card">
                                        <div class="small__product--thumbnail skeleton-img"
                                            style="width:70px;height:70px;border-radius:6px;"></div>
                                        <div class="small__product--content" style="flex:1;padding-left:10px;">
                                            <div class="skeleton-text" style="height:14px;width:80%;margin-bottom:8px;">
                                            </div>
                                            <div class="skeleton-text short" style="height:12px;width:50%;"></div>
                                        </div>
                                    </div>
                                    <div class="small__product--card d-flex skeleton-card">
                                        <div class="small__product--thumbnail skeleton-img"
                                            style="width:70px;height:70px;border-radius:6px;"></div>
                                        <div class="small__product--content" style="flex:1;padding-left:10px;">
                                            <div class="skeleton-text" style="height:14px;width:80%;margin-bottom:8px;">
                                            </div>
                                            <div class="skeleton-text short" style="height:12px;width:50%;"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="collection_wrapper">
                        <div class="shop__product--wrapper position__sticky">
                            <div class="shop__header">
                                <!-- Left: Filter Button -->
                                <div class="product__view--mode">
                                    <button class="widget__filter--btn" onclick="toggleFilter()">
                                        <svg class="widget__filter--btn__icon-svg" height="20" viewbox="0 0 512 512"
                                            width="20" xmlns="http://www.w3.org/2000/svg">
                                            <path d="M368 128h80M64 128h240M368 384h80M64 384h240M208 256h240M64 256h80"
                                                fill="none" stroke="currentColor" stroke-linecap="round"
                                                stroke-linejoin="round" stroke-width="32"></path>
                                            <circle cx="336" cy="128" fill="none" r="32" stroke="currentColor"
                                                stroke-linecap="round" stroke-linejoin="round" stroke-width="32">
                                            </circle>
                                            <circle cx="176" cy="256" fill="none" r="32" stroke="currentColor"
                                                stroke-linecap="round" stroke-linejoin="round" stroke-width="32">
                                            </circle>
                                            <circle cx="336" cy="384" fill="none" r="32" stroke="currentColor"
                                                stroke-linecap="round" stroke-linejoin="round" stroke-width="32">
                                            </circle>
                                        </svg>
                                        <span class="widget__filter--btn__text">Filters</span>
                                    </button>
                                </div>
                                <!-- Center: Product Count -->
                                <div class="product__count text-center">
                                    <span class="loading-state-text">Loading…
                                        products</span>
                                </div>
                                <!-- Right: Sort By Dropdown -->
                                <div class="product__view--mode__list product__short--by">
                                    <div class="select shop__header--select">
                                        <select class="product__view--select" id="sort-select">
                                            <option selected="" value="">Sort by</option>
                                            <option value="newest">Sort by latest</option>
                                            <option value="price_asc">Sort by price: low to high</option>
                                            <option value="price_desc">Sort by price: high to low</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="tab_content">
                                <div id="collection-tabs" class="collection-tabs"></div>
                                <div class="tab_pane active show" id="product_grid">
                                    <div class="product__section--inner">
                                        <div class="product-grid" data-section="product-grid"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="pagination__area" id="pagination-container">
                                <!-- Pagination generated dynamically by ProductGrid.js -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
    </main>
    <footer id="site-footer" class="footer__section footer__bg" data-section-id="footer"></footer>
    <script defer src="assets/footer.js"></script>
    <div class="filter-backdrop" id="filter-backdrop" onclick="toggleFilter()"></div>
    <style>
        /* Clean Card Styles for Shop Grid */
        .clean-card {
            display: flex;
            flex-direction: column;
            background: #fff;
            border: none;
            box-shadow: none;
            margin-bottom: 2rem;
            position: relative;
        }

        .clean-card-thumbnail {
            position: relative;
            background: #f4f4f4;
            overflow: hidden;
            border-radius: 4px;
        }

        .clean-card-thumbnail img {
            width: 100%;
            height: auto;
            aspect-ratio: 3 / 4;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .clean-card:hover .clean-card-thumbnail img {
            transform: scale(1.03);
        }

        .clean-card-add {
            position: absolute;
            bottom: 12px;
            right: 12px;
            width: 36px;
            height: 36px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            color: #000;
            transition: transform 0.3s ease, background 0.3s ease, color 0.3s ease;
            z-index: 2;
        }

        .clean-card-add:hover {
            background: #000;
            color: #fff;
            transform: translateY(-2px);
        }

        .clean-card-content {
            padding: 12px 0 0;
            text-align: center;
        }

        .clean-card-title {
            font-size: 1.4rem;
            font-weight: 500;
            margin-bottom: 6px;
            line-height: 1.2;
        }

        .clean-card-title a {
            color: #000;
            text-decoration: none;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .clean-card-price {
            font-size: 1.3rem;
            font-weight: 600;
            color: #555;
        }

        @media(max-width: 575px) {
            .custom-col {
                padding-left: 8px;
                padding-right: 8px;
            }

            .clean-card-title {
                font-size: 1.2rem;
            }

            .clean-card-price {
                font-size: 1.1rem;
            }
        }
    </style>
</body>

</html>
